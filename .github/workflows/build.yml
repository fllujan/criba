name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: Tests (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [macos-14, windows-latest]
    runs-on: ${{ matrix.os }}
    env:
      QT_QPA_PLATFORM: offscreen
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@v5

      - name: Instalar uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Instalar dependencias
        run: uv sync --locked

      - name: Ruff
        run: |
          uv run ruff format --check .
          uv run ruff check .

      - name: Mypy (strict)
        run: uv run mypy

      - name: Pytest + cobertura
        run: uv run pytest --cov --cov-report=xml -m "not live"

      - name: Subir cobertura
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-${{ matrix.os }}
          path: coverage.xml
          if-no-files-found: ignore

  # Los jobs de empaquetado (.dmg y .exe) y la release se añaden en la fase F6.
