[project]
name = "criba"
version = "0.1.0"
description = "Convierte un libro en PDF en un resumen para estudiar y un esquema de examen."
readme = "README.md"
requires-python = ">=3.12,<3.13"
authors = [{ name = "Félix Luján" }]
license = { text = "Proprietary" }
dependencies = [
    "anthropic>=1.15.0",
    "keyring>=25.7.0",
    "platformdirs>=4.13.4",
    "pydantic>=2",
    "pymupdf>=1.28.2",
    "pyside6>=6.12.0",
    "reportlab>=5.0.1",
]

[project.scripts]
criba = "criba.cli:main"

[project.gui-scripts]
criba-gui = "criba.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/criba"]

# --- Ruff ---------------------------------------------------------------
[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]
include = ["src/**/*.py", "tests/**/*.py", "scripts/**/*.py"]

[tool.ruff.lint]
select = [
    "E", "W", "F", "I", "B", "UP", "SIM", "RUF", "N", "C4", "PTH", "RET",
    "PL", "TID", "S", "ANN", "D",
]
ignore = [
    "D100", "D104", "D105", "D107", "D203", "D213",
    "PLR0913", "RUF001", "RUF002", "RUF003",
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S603", "D", "ANN", "PLR2004", "TID251"]
"src/criba/gui/**" = ["TID251", "N802"]
"src/criba/__main__.py" = ["TID251"]

[tool.ruff.lint.flake8-tidy-imports.banned-api]
"PySide6".msg = "core/ y render/ no pueden importar Qt (solo gui/)."

# --- Mypy ---------------------------------------------------------------
[tool.mypy]
python_version = "3.12"
strict = true
mypy_path = "src"
packages = ["criba"]
warn_unreachable = true
untyped_calls_exclude = ["pymupdf"]

[[tool.mypy.overrides]]
module = ["reportlab.*", "keyring.*"]
ignore_missing_imports = true

# --- Pytest -------------------------------------------------------------
[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
markers = [
    "live: llama a la API real de Anthropic (requiere ANTHROPIC_API_KEY)",
    "gui: tests de interfaz con pytest-qt",
]
qt_api = "pyside6"
filterwarnings = [
    "error",
    "ignore:builtin type (SwigPyPacked|SwigPyObject|swigvarlink) has no __module__ attribute:DeprecationWarning",
]

[tool.coverage.run]
source = ["criba"]
branch = true
omit = ["src/criba/gui/*", "src/criba/__main__.py"]

[tool.coverage.report]
fail_under = 80
show_missing = true
skip_covered = true
exclude_also = ["if TYPE_CHECKING:", "raise NotImplementedError"]

[dependency-groups]
dev = [
    "mypy>=2.4.0",
    "pre-commit>=4.7.0",
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "pytest-qt>=4.5.0",
    "ruff>=0.17.1",
]
